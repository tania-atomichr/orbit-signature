name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every script parses
        run: for f in src/*.js server.mjs test/*.mjs scripts/*.mjs; do node --check "$f"; done
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
